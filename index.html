<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Secret de l'Insuline</title>
  <meta name="description" content="Découvrez la routine de 21 jours adaptée à votre corps. Quiz gratuit." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Le Secret de l'Insuline" />
  <meta property="og:description" content="Découvrez la routine de 21 jours adaptée à votre corps. Quiz gratuit." />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="estilo.css" />
  <style>
    /* Complementos do CSS original */
    .faq-item { border-bottom: 1px solid hsl(var(--border)); }
    .faq-item summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: 1rem 0; font-size: .875rem; font-weight: 700; }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary svg { flex-shrink: 0; transition: transform .2s; }
    .faq-item[open] summary svg { transform: rotate(180deg); }
    .faq-item p { padding-bottom: 1rem; font-size: .875rem; color: hsl(var(--muted-foreground)); }
    .aviso { font-size: 10px; line-height: 1.4; color: hsl(var(--muted-foreground)); text-align: center; }
    .btn-quiz:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div id="app" class="h-[100dvh] flex flex-col max-w-lg mx-auto overflow-hidden bg-background"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO — edite aqui
   ============================================================ */
const CONFIG = {
  checkout: "#",                       // link do checkout
  preco: "19,90 €",                    // preço exibido
  precoObs: "Paiement unique · Accès à vie",
  medicaNome: "",                      // ex.: "Dre Juliana Martins" (vazio = só "Médecin")
  medicaTitulo: "CRÉATRICE DE LA MÉTHODE",
  imagemTela6: "imagens/imagemaq.png", // IMAGEMAQUI — imagem da tela 6                   // IMAGEMAQUI — caminho da imagem da tela 6, ex.: "imagens/minha-imagem.jpg"
};

/* ============================================================
   ESTADO
   ============================================================ */
const TOTAL = 29;
const state = {
  age: "", bodyType: "", bodyAreas: [], name: "", weightImpact: "", appearance: "",
  barriers: [], goals: [], weight: 75, height: 165, desiredWeight: 65, routine: [],
  sleep: "", commitment: "", bloating: "", firstResult: "",
};
let page = (() => {
  const p = parseInt(new URLSearchParams(location.search).get("page"), 10);
  return Number.isFinite(p) && p >= 1 ? p : 1;
})();
let timers = [];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nome = () => esc(state.name || "Vous");
const IMG = (f) => "imagens/" + f;

function next() { page++; render(); }
function back() { page = Math.max(1, page - 1); render(); }
function set(key, value) { state[key] = value; }
function pick(key, value) { set(key, value); render(); setTimeout(next, 300); }
function toggle(key, value) {
  const arr = state[key];
  state[key] = arr.includes(value) ? arr.filter((v) => v !== value) : [...arr, value];
  render();
}
function step(key, delta, min, max) { state[key] = Math.max(min, Math.min(max, state[key] + delta)); render(); }

/* ============================================================
   COMPONENTES
   ============================================================ */
const chevronLeft = `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
const chevronDown = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;

function header() {
  const pct = ((page - 1) / (TOTAL - 1)) * 100;
  return `
  <div class="flex-shrink-0 px-4 pt-3 pb-2 bg-background">
    <div class="flex items-center gap-3 mb-2">
      <button onclick="back()" class="p-1 -ml-1 text-muted-foreground" aria-label="Retour">${chevronLeft}</button>
      <img src="${IMG("logo.svg")}" alt="Le Secret de l'Insuline" class="h-11 object-contain" />
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function singleChoice(title, key, options, opts = {}) {
  const textSize = opts.small ? "font-bold text-sm" : "font-bold";
  return `
  <div class="px-5 py-8 flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">${title}</h2>
    <div class="flex flex-col gap-3 mt-4">
      ${options.map((o) => `
        <button onclick="pick('${key}','${o.value}')" class="quiz-option flex items-center gap-3 ${state[key] === o.value ? "selected" : ""}">
          <span class="text-2xl">${o.emoji}</span><span class="${textSize}">${o.label}</span>
        </button>`).join("")}
    </div>
  </div>`;
}

function multiChoice(title, key, options) {
  return `
  <div class="px-5 py-8 flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">${title}</h2>
    <p class="text-sm text-muted-foreground text-center -mt-1">Sélectionnez toutes les réponses qui s'appliquent</p>
    <div class="flex flex-col gap-3 mt-1">
      ${options.map((o) => `
        <button onclick="toggle('${key}','${o.value}')" class="quiz-option flex items-center gap-3 ${state[key].includes(o.value) ? "selected" : ""}">
          <span class="text-2xl">${o.emoji}</span><span class="font-bold text-sm">${o.label}</span>
        </button>`).join("")}
    </div>
    <button onclick="next()" ${state[key].length === 0 ? "disabled" : ""} class="btn-quiz">Continuer</button>
  </div>`;
}

function stepper(title, key, unit, min, max) {
  const v = state[key];
  const extra = key === "desiredWeight" && state.weight - v > 0
    ? `<div class="bg-btn-green/10 text-btn-green font-bold px-4 py-2 rounded-full text-sm">Objectif : perdre ${state.weight - v} kg 🎯</div>` : "";
  return `
  <div class="px-5 py-8 flex flex-col gap-6 items-center">
    <h2 class="text-2xl font-extrabold text-center">${title}</h2>
    <div class="text-6xl font-black text-primary">${v}<span class="text-2xl font-bold ml-1">${unit}</span></div>
    <div class="flex gap-3">
      ${[["-5", -5], ["−", -1], ["+", 1], ["+5", 5]].map(([l, d]) =>
        `<button onclick="step('${key}',${d},${min},${max})" class="w-14 h-14 rounded-full border-2 border-border font-bold text-lg hover:bg-muted transition-colors">${l}</button>`).join("")}
    </div>
    ${extra}
    <button onclick="next()" class="btn-quiz">Continuer</button>
  </div>`;
}

const checks = `
  <div class="flex items-center justify-center gap-2 text-[10px] text-muted-foreground flex-wrap shrink-0">
    <span class="flex items-center gap-1"><span class="text-btn-green">✓</span> 100 % gratuit</span>
    <span class="text-border">·</span>
    <span class="flex items-center gap-1"><span class="text-btn-green">✓</span> Résultat immédiat</span>
    <span class="text-border">·</span>
    <span class="flex items-center gap-1"><span class="text-btn-green">✓</span> 100 % naturel</span>
  </div>`;

/* ============================================================
   DADOS
   ============================================================ */
const AREAS = {
  papada: { label: "Double menton", emoji: "😊", frase: "du double menton" },
  bracos: { label: "Bras", emoji: "💪", frase: "des bras" },
  barriga: { label: "Ventre", emoji: "🤰", frase: "du ventre" },
  cintura: { label: "Taille", emoji: "💝", frase: "de la taille" },
  gluteos: { label: "Fessiers", emoji: "🍑", frase: "des fessiers" },
  coxas: { label: "Cuisses", emoji: "🦵", frase: "des cuisses" },
  "corpo-todo": { label: "Tout le corps", emoji: "✨", frase: "de tout le corps" },
};

function frasesAreas() {
  const sel = state.bodyAreas.filter((a) => a !== "corpo-todo");
  const t = (sel.length ? sel : ["barriga"]).map((a) => AREAS[a].frase);
  if (t.length === 1) return t[0];
  return t.slice(0, -1).join(", ") + " et " + t[t.length - 1];
}

const DEPOIMENTOS = [
  { quote: "J'ai perdu 9 kg en 21 jours. J'ai dû jeter certains pantalons et shorts.", name: "Maria", age: 47, result: "-9 kg", image: "antes-depois-maria.jpg" },
  { quote: "", name: "Rosana", age: 52, result: "-7 kg", image: "antes-depois-rosana.jpg" },
  { quote: "Je me suis regardée dans le miroir et je me suis reconnue.", name: "Fernanda", age: 43, result: "-11 kg", image: "antes-depois-fernanda.jpg" },
  { quote: "J'ai retrouvé l'énergie pour m'occuper de mes enfants.", name: "Claudia", age: 36, result: "-8 kg", image: "antes-depois-4.jpg" },
];

const FAQ = [
  { q: "Est-ce que la méthode fonctionne vraiment ?", a: "La méthode repose sur des recettes simples et rassasiantes et une routine alimentaire de 21 jours créée par une médecin. Les résultats varient selon chaque personne, son point de départ et sa régularité." },
  { q: "En combien de temps vais-je voir une différence ?", a: "Beaucoup de femmes disent se sentir moins ballonnées et avoir moins de fringales dès les premières semaines. La perte de poids dépend de chacune et de la régularité avec laquelle la routine est suivie." },
  { q: "Est-ce sans danger ?", a: "Ce sont des recettes à base d'aliments courants. Ce n'est pas un médicament et cela ne remplace pas un avis médical. Si vous êtes enceinte, allaitez, suivez un traitement ou avez une maladie chronique, parlez-en à votre médecin avant de commencer." },
  { q: "Comment vais-je recevoir le programme ?", a: "Juste après le paiement, vous recevez par e-mail l'accès à l'application avec les recettes, la routine de 21 jours et tous les bonus. L'accès est immédiat et à vie." },
  { q: "Et si ça ne me convient pas ?", a: "Vous avez 30 jours de garantie. Si le programme ne vous convient pas, nous vous remboursons intégralement, sans justification." },
  { q: "Le paiement est-il sécurisé ?", a: "Oui. Le paiement passe par une plateforme sécurisée et chiffrée. Vos données sont protégées." },
  { q: "Faut-il acheter des ingrédients chers ?", a: "Non. Tous les ingrédients se trouvent au supermarché et restent abordables." },
];

/* ============================================================
   PÁGINAS
   ============================================================ */
const PAGES = {
  // 1 — Capa

  <div class="flex flex-col h-full bg-[#FFF5EB] overflow-hidden">

      <div class="relative flex-1 min-h-0">
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[85%] h-[80%] rounded-full pointer-events-none" style="background:radial-gradient(circle, rgba(255,170,60,0.28) 0%, rgba(255,170,60,0) 68%)"></div>
        <img src="${IMG("doutora-cover.png")}" alt="La médecin créatrice de la méthode avec la recette" class="absolute inset-0 w-full h-full object-cover object-top drop-shadow-[0_10px_18px_rgba(120,70,10,0.22)]" />
        <div class="absolute left-1 top-1 bg-white/90 backdrop-blur-sm rounded-full pl-1.5 pr-3 py-1 shadow-md flex items-center gap-1.5 z-10">
          <span class="text-base">🩺</span>
          <div class="leading-none">
            <div class="text-[11px] font-black text-foreground">${esc(CONFIG.medicaNome || "Médecin")}</div>
            <div class="text-[8px] font-semibold text-muted-foreground tracking-wide">${esc(CONFIG.medicaTitulo)}</div>
          </div>
        </div>
        <div class="absolute right-2 top-[52%] bg-primary text-primary-foreground text-[11px] font-black px-2.5 py-1 rounded-full shadow-lg ring-2 ring-[#FFF5EB] z-10 whitespace-nowrap">recette économique</div>
      </div>
      <div class="text-center text-[11px] text-muted-foreground leading-snug shrink-0">
        Répondez au quiz et découvrez <strong class="text-btn-green">la version adaptée à votre corps</strong>
      </div>
      <button onclick="next()" class="btn-quiz-green text-sm shrink-0">JE DÉCOUVRE MA VERSION</button>
      ${checks}
    </div>
  </div>`,

  // 2 — Idade
  2: () => singleChoice("Quel âge avez-vous ?", "age", [
    { value: "18-27", emoji: "🌸", label: "18 – 27 ans" },
    { value: "28-39", emoji: "💐", label: "28 – 39 ans" },
    { value: "40-54", emoji: "🌺", label: "40 – 54 ans" },
    { value: "54+", emoji: "🌷", label: "54 ans et +" },
  ]),

  // 3 — Tipo de corpo
  3: () => {
    const opts = [
      { value: "medio", label: "Moyenne", img: "body-medio.webp" },
      { value: "acima-do-peso", label: "Quelques kilos en trop", img: "body-acima.webp" },
      { value: "sobrepeso", label: "Surpoids", img: "body-sobrepeso.webp" },
      { value: "plus-size", label: "Grande taille", img: "body-plussize.webp" },
    ];
    return `
    <div class="px-5 py-8 flex flex-col gap-4">
      <h2 class="text-2xl font-extrabold text-center">Comment est votre <span class="gradient-text">corps aujourd'hui</span> ?</h2>
      <div class="grid grid-cols-2 gap-3 mt-2">
        ${opts.map((o) => `
          <button onclick="pick('bodyType','${o.value}')" class="quiz-option flex flex-col items-center gap-2 py-3 ${state.bodyType === o.value ? "selected" : ""}">
            <img src="${IMG(o.img)}" alt="${o.label}" class="w-28 h-28 object-cover rounded-lg" loading="lazy" />
            <span class="font-bold text-sm">${o.label}</span>
          </button>`).join("")}
      </div>
    </div>`;
  },

  // 4 — Áreas do corpo
  4: () => `
  <div class="px-5 py-6 flex flex-col gap-4">
    <h2 class="text-xl font-bold text-center">Où sentez-vous que votre <span class="gradient-text">corps a le plus changé</span> ?</h2>
    <div class="flex gap-3 items-stretch">
      <div class="w-[42%] relative flex-shrink-0"><img src="${IMG("body-areas.webp")}" alt="Zones du corps" class="w-full h-full rounded-lg object-cover" loading="lazy" /></div>
      <div class="flex-1 flex flex-col gap-2">
        ${Object.entries(AREAS).map(([v, a]) => `
          <button onclick="toggle('bodyAreas','${v}')" class="quiz-option flex items-center gap-2 py-2 text-sm ${state.bodyAreas.includes(v) ? "selected" : ""}">
            <span>${a.emoji}</span><span class="font-semibold">${a.label}</span>
          </button>`).join("")}
      </div>
    </div>
    <button onclick="next()" ${state.bodyAreas.length === 0 ? "disabled" : ""} class="btn-quiz">Continuer</button>
  </div>`,

  // 5 — Você não está sozinha
  5: () => `
  <div class="flex flex-col items-center justify-center h-full px-6 py-8 text-center animate-fade-in">
    <div class="mb-6"><div class="w-16 h-16 rounded-full bg-secondary flex items-center justify-center mx-auto"><span class="text-3xl">🤝</span></div></div>
    <h2 class="text-2xl font-bold text-foreground mb-4 leading-tight">Vous n'êtes pas <span class="gradient-text">seule.</span></h2>
    <div class="bg-card rounded-2xl shadow-md border border-border px-6 py-5 mb-6 w-full max-w-sm">
      <div class="text-5xl font-black text-primary mb-1">💬</div>
      <p class="text-sm text-muted-foreground mb-4">C'est l'une des plaintes les plus fréquentes chez les femmes</p>
      <p class="text-base font-semibold text-foreground leading-snug">
        Beaucoup de femmes voient la graisse s'installer au niveau <span class="gradient-text">${frasesAreas()}</span> même sans manger beaucoup.
      </p>
    </div>
    <button onclick="next()" class="btn-quiz w-full">J'ai compris, je continue</button>
  </div>`,

  // 6 — A médica
  6: () => `
  <div class="px-5 py-8 flex flex-col gap-3 items-center animate-fade-in">
    <h2 class="text-2xl font-bold text-center text-foreground">Une méthode créée par une médecin 🩺</h2>
    <!-- IMAGEMAQUI: para colocar uma imagem aqui, preencha CONFIG.imagemTela6 no topo do script -->
    <div class="w-full rounded-2xl overflow-hidden border border-border shadow-md bg-[#FFF5EB]">
      <img src="${esc(CONFIG.imagemTela6)}" alt="" class="w-full h-auto" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <div class="items-center justify-center text-muted-foreground font-bold" style="display:none;height:42vh;border:2px dashed hsl(var(--border))">IMAGEMAQUI</div>
    </div>
    <p class="text-base text-muted-foreground leading-relaxed text-center">
      ${CONFIG.medicaNome ? esc(CONFIG.medicaNome) + " a créé" : "Elle a créé"} cette routine pour les femmes qui veulent mieux manger sans régime compliqué : des recettes simples et rassasiantes, préparées au mixeur.
    </p>
    <button onclick="next()" class="btn-quiz w-full">Continuer</button>
  </div>`,

  // 7 — Nome
  7: () => `
  <div class="px-5 py-8 flex flex-col gap-6 items-center">
    <h2 class="text-2xl font-extrabold text-center">Comment puis-je vous appeler ?</h2>
    <input id="nome" type="text" value="${esc(state.name)}" placeholder="Votre prénom"
      oninput="state.name=this.value; document.getElementById('btnNome').disabled=!this.value.trim()"
      onkeydown="if(event.key==='Enter'&&this.value.trim()){state.name=this.value.trim();next()}"
      class="w-full text-center text-xl font-bold py-4 px-4 border-2 rounded-xl border-border focus:border-primary focus:outline-none bg-background" />
    <button id="btnNome" onclick="state.name=state.name.trim(); next()" ${state.name.trim() ? "" : "disabled"} class="btn-quiz">Continuer</button>
  </div>`,

  // 8 — O que incomoda
  8: () => {
    const opts = [
      { value: "autoestima", emoji: "💔", title: "Mon estime de moi", desc: "Je me regarde dans le miroir et je ne me reconnais plus" },
      { value: "saude", emoji: "🩺", title: "Ma santé", desc: "J'ai l'impression que ma santé en pâtit" },

  9: () => singleChoice(`Avez-vous déjà essayé de <span class="gradient-text">maigrir</span> ?`, "appearance", [

  <div class="px-5 py-8 flex flex-col gap-6 items-center text-center">

    <h2 class="text-xl font-bold leading-snug">Pas besoin de produits chers ni de régime compliqué.</h2>

          <h1 class="text-xl font-bold leading-snug"><span class="gradient-text">${nome()}</span>, votre routine de 21 jours avec Le Secret de l'Insuline est prête</h1>
          <p class="text-sm text-muted-foreground mt-3">Elle a été préparée à partir de vos réponses au quiz.</p>
        </div>
        <div class="rounded-2xl overflow-hidden border border-border shadow-sm">
          <div class="bg-primary text-primary-foreground p-4 text-center">
            <div class="text-xs uppercase tracking-wider opacity-90">Votre plan personnalisé</div>
            <div class="text-lg font-bold mt-1">Routine de 21 jours</div>
          </div>
          <div class="p-4 flex flex-col gap-3">
            ${plano.map((v) => `
              <div class="flex items-center gap-3 border border-border rounded-xl p-3">
                <span class="text-2xl">${v.icon}</span>
                <div class="flex-1"><div class="text-xs uppercase font-bold text-primary">${v.day}</div><div class="font-bold text-sm">${v.desc}</div></div>
                ${v.meta ? `<span class="bg-btn-green text-primary-foreground text-xs px-2 py-1 rounded font-bold">OBJECTIF</span>` : ""}
              </div>`).join("")}
          </div>
        </div>
        <div class="text-center"><h2 class="text-base font-bold">Vous recevez aussi <span class="text-primary">3 bonus</span></h2></div>
        <div class="flex flex-col gap-3">
          ${bonus.map((v) => `
            <div class="rounded-xl border border-border bg-secondary/40 p-4 flex gap-3">
              <span class="text-2xl shrink-0">🎁</span>
              <div><div class="font-bold text-sm">${v.title}</div><div class="text-xs text-muted-foreground mt-1">${v.desc}</div></div>
            </div>`).join("")}
        </div>
        <div class="rounded-2xl overflow-hidden border border-border shadow-sm">
          <div class="bg-primary text-primary-foreground p-4 text-center">
            <div class="text-xs uppercase tracking-wider opacity-90">Découvrez</div>
            <div class="text-base font-bold mt-1">Tout ce à quoi vous aurez accès</div>
          </div>
          <div class="p-4 flex flex-col gap-2">
            ${inclui.map(([t, b]) => `<div class="flex items-start gap-2 text-sm"><span class="text-btn-green shrink-0">${b ? "🎁" : "✅"}</span><span>${t}</span></div>`).join("")}
            <div class="border-t border-border mt-3 pt-4 text-center">
              <div class="text-xs text-muted-foreground mt-2">POUR SEULEMENT</div>
              <div class="text-5xl font-black text-btn-green leading-none mt-1">${esc(CONFIG.preco)}</div>
              <div class="text-sm text-muted-foreground mt-2">${esc(CONFIG.precoObs)}</div>
            </div>
          </div>
        </div>
        ${cta("JE COMMENCE 🥰")}
        <div class="rounded-2xl p-5 text-center border-2 border-primary bg-secondary">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary text-primary-foreground font-black text-xs leading-tight mb-3">GARANTIE<br>30<br>JOURS</div>
          <div class="font-bold text-base">Satisfaite ou remboursée</div>
          <p class="text-sm text-muted-foreground mt-2">Vous avez 30 jours pour tester la routine.</p>
          <p class="text-sm text-muted-foreground mt-2">Si elle ne vous convient pas, nous vous remboursons intégralement, sans justification.</p>
        </div>
        <div>
          <h3 class="text-lg font-bold text-center mb-3">❓ Questions fréquentes</h3>
          <div class="w-full">
            ${FAQ.map((f) => `<details class="faq-item"><summary><span class="text-left">${f.q}</span>${chevronDown}</summary><p>${f.a}</p></details>`).join("")}
          </div>
        </div>
        ${cta("JE COMMENCE MAINTENANT ! 🔥")}
        <div class="text-center text-xs text-muted-foreground pt-4">🔒 Paiement 100 % sécurisé · Vos données sont protégées</div>
        <p class="aviso pb-4">Ce programme propose des recettes et une routine alimentaire. Il ne remplace pas un avis médical. Les résultats varient d'une personne à l'autre.</p>
      </div>
    </div>`;
  },
};

/* ============================================================
   RENDER
   ============================================================ */
const scroller = document.createElement("div");
scroller.className = "flex-1 overflow-y-auto";

function render() {
  timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
  timers = [];
  const app = document.getElementById("app");
  const showHeader = page > 1 && page < TOTAL;
  const keepScroll = app.dataset.page === String(page);
  const prevScroll = scroller.scrollTop;
  const focusNome = document.activeElement && document.activeElement.id === "nome";
  app.innerHTML = showHeader ? header() : "";
  scroller.innerHTML = (PAGES[page] || PAGES[1])();
  app.appendChild(scroller);
  scroller.scrollTop = keepScroll ? prevScroll : 0;
  app.dataset.page = String(page);
  if (page === 7 && !focusNome) { const i = document.getElementById("nome"); if (i && !state.name) i.focus(); }
}
render();
</script>
</body>
</html>
